<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Songless Noot app icon</title>
  <desc id="desc">A vibrant green musical-note mascot wearing neutral gray headphones on a rounded white tile.</desc>
  <defs>
    <linearGradient id="tile" x1="128" y1="64" x2="896" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7faf7"/>
    </linearGradient>
    <linearGradient id="noot-green" x1="512" y1="232" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78df00"/>
      <stop offset="1" stop-color="#58c900"/>
    </linearGradient>
    <linearGradient id="crest-green" x1="536" y1="38" x2="626" y2="332" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82e900"/>
      <stop offset="1" stop-color="#63d300"/>
    </linearGradient>
    <linearGradient id="headband" x1="512" y1="222" x2="512" y2="477" gradientUnits="userSpaceOnUse">
      <stop stop-color="#56616a"/>
      <stop offset="1" stop-color="#303940"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#bcc3c7"/>
      <stop offset=".48" stop-color="#f0f2f3"/>
      <stop offset="1" stop-color="#9fa8ad"/>
    </linearGradient>
    <radialGradient id="iris" cx="37%" cy="30%" r="75%">
      <stop stop-color="#86500f"/>
      <stop offset=".65" stop-color="#4a2608"/>
      <stop offset="1" stop-color="#211003"/>
    </radialGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#152116" flood-opacity=".13"/>
    </filter>
    <clipPath id="tile-clip">
      <rect x="24" y="24" width="976" height="976" rx="196"/>
    </clipPath>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="196" fill="url(#tile)" stroke="#e3e7e3" stroke-width="8"/>

  <g clip-path="url(#tile-clip)">
    <!-- Neutral headphones sit behind the mascot so their silhouette remains clear. -->
    <path d="M168 588C168 368 321 227 512 227s344 141 344 361" fill="none" stroke="#101718" stroke-width="88" stroke-linecap="round"/>
    <path d="M168 588C168 368 321 227 512 227s344 141 344 361" fill="none" stroke="url(#headband)" stroke-width="70" stroke-linecap="round"/>
    <path d="M191 555C225 371 348 284 512 284s287 87 321 271" fill="none" stroke="#718089" stroke-opacity=".45" stroke-width="12" stroke-linecap="round"/>

    <!-- Noot body and musical-note crest. -->
    <path d="M503 349c47-33 68-82 69-146l2-108c0-39 35-65 70-46l82 47c34 19 43 63 20 94-21 28-59 34-88 15l-38-25-1 45c-1 63 27 99 81 131 84 49 133 148 145 281l28 363H151l28-363c12-133 61-232 145-281 52-30 95-39 179-7Z" fill="url(#crest-green)" stroke="#0a4616" stroke-width="14" stroke-linejoin="round" filter="url(#soft-shadow)"/>
    <path d="M321 376c57-42 123-62 191-62 68 0 134 20 191 62 85 64 123 169 131 315l18 309H172l18-309c8-146 46-251 131-315Z" fill="url(#noot-green)" stroke="#0a4616" stroke-width="14" stroke-linejoin="round"/>
    <path d="M350 394c-66 61-93 156-98 293l-10 278" fill="none" stroke="#98ef26" stroke-width="18" stroke-linecap="round" opacity=".42"/>

    <!-- Ear cups are in front of the body, matching the established mascot. -->
    <g stroke="#11191b" stroke-width="11">
      <rect x="104" y="489" width="123" height="302" rx="61" fill="#48535a"/>
      <rect x="145" y="503" width="105" height="281" rx="52" fill="url(#silver)"/>
      <rect x="797" y="503" width="105" height="281" rx="52" fill="url(#silver)"/>
      <rect x="820" y="489" width="123" height="302" rx="61" fill="#48535a"/>
    </g>
    <path d="M174 539c18-18 35-21 47-17" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="11" stroke-linecap="round"/>
    <path d="M850 539c18-18 35-21 47-17" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="11" stroke-linecap="round"/>

    <!-- Brows and eyes are deliberately oversized for recognizability at 32 px. -->
    <path d="M305 498c34-31 79-41 119-25M600 473c40-16 85-6 119 25" fill="none" stroke="#184a12" stroke-width="25" stroke-linecap="round"/>
    <g>
      <ellipse cx="368" cy="638" rx="106" ry="116" fill="#fff" stroke="#16391a" stroke-width="12"/>
      <ellipse cx="656" cy="638" rx="106" ry="116" fill="#fff" stroke="#16391a" stroke-width="12"/>
      <ellipse cx="382" cy="650" rx="63" ry="72" fill="url(#iris)"/>
      <ellipse cx="642" cy="650" rx="63" ry="72" fill="url(#iris)"/>
      <ellipse cx="382" cy="657" rx="39" ry="49" fill="#080b09"/>
      <ellipse cx="642" cy="657" rx="39" ry="49" fill="#080b09"/>
      <circle cx="358" cy="618" r="22" fill="#fff"/>
      <circle cx="618" cy="618" r="22" fill="#fff"/>
      <circle cx="400" cy="685" r="9" fill="#b57620" opacity=".65"/>
      <circle cx="660" cy="685" r="9" fill="#b57620" opacity=".65"/>
    </g>

    <ellipse cx="259" cy="780" rx="43" ry="27" fill="#ff9a72" opacity=".92"/>
    <ellipse cx="765" cy="780" rx="43" ry="27" fill="#ff9a72" opacity=".92"/>
    <path d="M475 759c18 34 56 34 74 0" fill="none" stroke="#174213" stroke-width="22" stroke-linecap="round"/>

    <ellipse cx="512" cy="1010" rx="197" ry="139" fill="#c8fa85" opacity=".78"/>
  </g>
</svg>
