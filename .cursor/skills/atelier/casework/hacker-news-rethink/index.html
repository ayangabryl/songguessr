<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hacker News</title>
<meta name="description" content="Hacker News front page, rethought for readers who come back several times a day.">
<script>
  /* Set the theme before first paint so there is no flash; the toggle in app.js only ever flips this attribute. */
  (function () {
    var stored = localStorage.getItem('hn-theme');
    var theme = stored === 'light' || stored === 'dark' ? stored
      : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="preload" href="fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="header-row">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">Y</span>
      <span class="brand-name">Hacker News</span>
    </div>
    <nav class="site-nav" aria-label="Sections">
      <a href="https://news.ycombinator.com/newest">new</a>
      <a href="https://news.ycombinator.com/front">past</a>
      <a href="https://news.ycombinator.com/newcomments">comments</a>
      <a href="https://news.ycombinator.com/ask">ask</a>
      <a href="https://news.ycombinator.com/show">show</a>
      <a href="https://news.ycombinator.com/jobs">jobs</a>
      <a href="https://news.ycombinator.com/submit">submit</a>
    </nav>
    <div class="header-actions">
      <a class="login-link" href="https://news.ycombinator.com/login">login</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">
        <svg class="theme-icon theme-icon--moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M14 9.7A6.3 6.3 0 0 1 6.3 2 6.3 6.3 0 1 0 14 9.7Z"/></svg>
        <svg class="theme-icon theme-icon--sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="3.4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M8 .8v2M8 13.2v2M15.2 8h-2M2.8 8h-2M13 3l-1.4 1.4M4.4 11.6 3 13M13 13l-1.4-1.4M4.4 4.4 3 3"/></g></svg>
        <span class="theme-toggle-label" id="theme-toggle-label">Dark</span>
      </button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <div id="app" aria-live="polite" aria-busy="false"></div>
</main>

<footer class="site-footer">
  <p><span id="story-count">30</span> stories</p>
</footer>

<script src="app.js"></script>
</body>
</html>
